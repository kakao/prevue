# 빌드 · 테스트 · 산출물 · CLI 계약 — 릴리즈 PR 의 CI 는 이 하나다. 버전 · 태그 · 동기화는 /ship 이 버전 커밋 전에 보고,
# 릴리즈 워크플로(release.yml)가 태그를 달기 전에 한 번 더 본다.
name: 빌드 검증

on:
  # 릴리즈 PR(→ main)과 작업 PR(→ develop)에서 돈다. 작업 PR 의 머지 관문은 로컬 검증(implement 스킬)이고,
  # 여기는 그 검증을 거치지 않는 외부 기여 PR 을 받는 그물이다.
  # push 는 걸지 않는다 — 머지할 때마다 같은 트리를 또 빌드한다(릴리즈 PR 하나에 빌드 셋이 돌았다).
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 사용자의 /bin/sh 에서 도는 스크립트(plugin/bin/prevue · plugin/build/prevue-env)를 bash 가 아니라 sh 로 본다.
defaults:
  run:
    shell: sh

permissions:
  contents: read

concurrency:
  # 릴리즈와 달리 앞선 실행은 버린다. 마지막 커밋의 결과만 의미가 있다.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소를 받는다
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 린트가 origin/main 과의 diff 로 새 주석 · 건드린 함수를 본다

      # 스킬 두 벌(plugin/skills/ · plugin/codex/skills/)은 skills-src/ 의 생성물이다. 한쪽만 손으로 고친 커밋을 여기서 막는다.
      - name: 스킬 두 벌이 원본에서 만들어졌는지 본다
        run: sh tools/gen-skills.sh --check

      # 설치본은 plugin/ 만 받는다(D-123) — 그 안의 LICENSE · NOTICE.md 는 루트 원본의 사본이다.
      - name: 플러그인의 고지 사본이 원본과 맞는지 본다
        run: sh tools/plugin-copies.sh --check

      # CLI 는 macOS 기본 python3(3.9)에서 돈다 — 러너의 새 python 으로 보면 3.10+ 문법이 그대로 지나간다.
      - name: python3를 3.9로 맞춘다
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # CLI 판정(prevue_plan.py · jdk_rule.py · daemon_records.py)과 에이전트 응답 크기(NFR-17 · NFR-18)의 단위 테스트.
      - name: 판정 로직 단위 테스트
        run: python3 -m unittest discover -s tests/cli

      - name: JDK를 올린다
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"      # build.gradle.kts 의 jvmToolchain(17) 과 같은 값이다

      # 제품 빌드는 플러그인 폴더(plugin/)가 하나의 Gradle 프로젝트다 — 설치본이 그 자리에서 굽는다.
      - name: 툴체인을 빌드한다
        working-directory: plugin
        run: |
          set -eu
          ./gradlew installPrevue --no-daemon

      # 가짜 포트 위의 Session·Server 테스트. 조용히 되돌아가도 화면은 멀쩡한 규칙들이라 눈으로는 못 잡는다.
      - name: 데몬 단위 테스트
        working-directory: plugin
        run: ./gradlew test --no-daemon

      # 슬롭 규칙 · detekt 지표 · 새 주석(D-70). 작업 PR 마다 로컬에서 돌렸으면 깨끗하다 — 여기는 건너뛴 것을 잡는 그물이다.
      # 비교 기준은 PR 이 가는 브랜치다. 손으로 돌리면(workflow_dispatch) main 과 견준다.
      - name: Kotlin 린트
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -eu
          sh tools/lint.sh --base "origin/$BASE_REF"

      - name: 산출물이 나왔는지 본다
        working-directory: plugin
        run: |
          set -eu
          test -s build/libs/prevue.jar || { echo "::error::prevue.jar 가 없다"; exit 1; }

      - name: 빌드 결과를 확인한다
        working-directory: plugin
        run: |
          set -eu
          test -s build/prevue-env || { echo "::error::prevue-env 가 없다"; exit 1; }

          # prevue-env 는 절대 경로를 적지 않는다 — 빌드한 머신에서만 맞는 값이 되기 때문이다.
          # 값은 ROOT(플러그인 디렉터리)와 HOME 기준이라 읽는 쪽이 ROOT 를 준다. bin/prevue 가 하는 것과 같다.
          grep -qE '=\"/|:/[A-Za-z]' build/prevue-env \
            && { echo "::error file=build/prevue-env::절대 경로가 들어갔다"; sed -n '4,9p' build/prevue-env; exit 1; } || true
          ROOT="$PWD"
          . build/prevue-env
          # 이름으로 값을 읽는다. 이름은 아래 목록으로 한정된다.
          for NAME in PREVUE_CP PREVUE_BRIDGE PREVUE_LAYOUTLIB PREVUE_COMPILER PREVUE_VIEWER; do
            eval "VAL=\${$NAME:-}"
            test -n "$VAL" || { echo "::error::prevue-env 에 $NAME 이 비었다"; exit 1; }
          done
          # 어긋났을 때 무엇과 무엇이 어긋났는지 보이게 한다. 값만 보고는 못 읽는다.
          echo "HOME=$HOME · ROOT=$ROOT"
          echo "layoutlib=$PREVUE_LAYOUTLIB"; ls -d "$PREVUE_LAYOUTLIB" 2>/dev/null || echo "  (그 경로가 없다)"
          ls -d "$HOME"/.prevue/toolchain/* 2>/dev/null || echo "  (툴체인이 HOME 아래 없다)"
          test -d "$PREVUE_LAYOUTLIB/data" || { echo "::error::layoutlib 조립이 덜 됐다"; exit 1; }
          test -s "$PREVUE_BRIDGE" || { echo "::error::브리지 jar 가 없다"; exit 1; }
          ls "$PREVUE_COMPILER"/*.jar >/dev/null || { echo "::error::컴파일러 jar 가 없다"; exit 1; }

          # kotlin-reflect 가 renderer 보다 앞에 있어야 한다. 렌더러 jar가 옛 reflect 를
          # 섀도잉 없이 품고 있어 순서가 뒤집히면 @PreviewParameter 가 런타임에 죽는다.
          # 컴파일로는 안 잡히는 회귀라 여기서 본다.
          # 순서만 보고 실재를 안 봤더니, prevue.jar 를 아무도 굽지 않는 회귀를 이 스텝이 놓쳤다.
          for P in $(echo "$PREVUE_CP" | tr ':' ' '); do
            test -e "$P" || { echo "::error::클래스패스가 없는 것을 가리킨다: $P"; exit 1; }
          done
          echo "클래스패스 항목 전부 실재한다"

          R=$(echo "$PREVUE_CP" | tr ':' '\n' | grep -n 'kotlin-reflect' | head -1 | cut -d: -f1 || true)
          N=$(echo "$PREVUE_CP" | tr ':' '\n' | grep -n 'compose-preview-renderer' | head -1 | cut -d: -f1 || true)
          test -n "$R" -a -n "$N" || { echo "::error::클래스패스에서 reflect 나 renderer 를 못 찾았다"; exit 1; }
          test "$R" -lt "$N" || { echo "::error::kotlin-reflect($R) 가 renderer($N) 보다 뒤에 있다"; exit 1; }
          echo "클래스패스 순서 OK — reflect $R < renderer $N"

      - name: CLI 계약을 확인한다
        working-directory: plugin
        run: |
          set -eu
          command -v bash >/dev/null || { echo "::warning::bash 가 없어 CLI 계약 검사를 건너뛴다"; exit 0; }
          # 사용법은 2, 데몬에 닿지 못하면 3이다(FR-13). 이 숫자로 스킬이 분기한다.
          set +e; ./bin/prevue >/dev/null 2>&1; RC=$?; set -e
          test "$RC" = "2" || { echo "::error::prevue 사용법 종료 코드가 2가 아니라 $RC"; exit 1; }
          set +e; OUT="$(./bin/prevue status 2>&1)"; RC=$?; set -e
          test "$RC" = "3" || { echo "::error::데몬 없는 status 종료 코드가 3이 아니라 $RC"; exit 1; }
          # 3 은 python3 가 없을 때도 난다 — 그 경로면 데몬 없음을 본 것이 아니다.
          case "$OUT" in *'"python3"'*) echo "::error::status 가 데몬이 아니라 python3 확인에서 3으로 끝났다: $OUT"; exit 1;; esac
