# Entry point of Verify — calls the static checks, the build, the unit tests and the integration tests. Work PRs and the
# release PR (develop → main) run the same Verify. On the release PR its verdict is one of the two merge conditions; the
# other is the skill evaluation certificate (/ship). Version · tag · sync are checked by /ship before the version commit,
# and once more by the Release workflow (release.yml) before it tags.
# The file keeps its name build.yml: the README badges link to it, and dispatching a branch needs this file on main.
name: Verify

on:
  # Runs on release PRs (→ main) and work PRs (→ develop). Work PRs pass local checks (tools/check-local.sh) before they are
  # opened; for outside contributions, which skip the local checks, this is the only verification. A person merges once the
  # verdict is green.
  # No push trigger — every merge would build the same tree again (one release PR once ran three builds).
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unlike Release, earlier runs are dropped. Only the result for the last commit matters.
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The static checks and the build run side by side first; when both pass, the unit and integration tests run side by side.
# Fail fast. The verdict below needs every job to finish, so one quick failure (a toolchain download that hit a rate limit
# failed in 25s) still waited for the slowest job (up to 15 minutes of lint). lint · compile · unit end with a step that
# cancels the run when the job failed, which turns ci-success red right away (it runs on cancel via always()). The step
# lives inside each job, not in jobs of its own, so the PR's check list shows only the real checks. actions: write is
# what the cancel needs; a called workflow cannot exceed what its caller grants, so it is granted here and there.
# Integration shards do not cancel — fail-fast: false lets every shard report.
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      actions: write

  compile:
    uses: ./.github/workflows/compile.yml
    permissions:
      contents: read
      actions: write

  unit:
    needs: [lint, compile]
    uses: ./.github/workflows/unit.yml
    permissions:
      contents: read
      actions: write

  integration:
    needs: [lint, compile]
    uses: ./.github/workflows/integration.yml

  # The verdict. The required check of both rulesets (develop and main) is this name (ci-success). Checks of called
  # workflows are named "caller job / called job", so the results are gathered into this one job. Fails when any of them
  # failed, was cancelled or was skipped. always(), not !cancelled(): a job that never starts reports as skipped, and a
  # skipped required check lets a PR merge — this job must run and fail instead.
  ci-success:
    if: ${{ always() }}
    needs: [lint, compile, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that static checks, build, unit and integration tests passed
        env:
          RESULTS: lint=${{ needs.lint.result }} compile=${{ needs.compile.result }} unit=${{ needs.unit.result }} integration=${{ needs.integration.result }}
        run: |
          echo "$RESULTS"
          for R in $RESULTS; do
            case "$R" in *=success) ;; *) echo "::error::$R"; exit 1;; esac
          done
