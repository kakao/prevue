# Entry point of Verify — calls the static checks, the build, the unit tests and the integration tests. This is the only CI of
# a release PR. Version · tag · sync are checked by /ship before the version commit, and once more by the Release workflow
# (release.yml) before it tags.
# The file keeps its name build.yml: the README badges link to it, and dispatching a branch needs this file on main.
name: Verify

on:
  # Runs on release PRs (→ main) and work PRs (→ develop). Work PRs are merged after local checks and this result (implement
  # skill); for outside contributions, which skip the local checks, this is the only verification. Not a required check on develop.
  # No push trigger — every merge would build the same tree again (one release PR once ran three builds).
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unlike Release, earlier runs are dropped. Only the result for the last commit matters.
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The static checks and the build run side by side first; when both pass, the unit and integration tests run side by side.
jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  compile:
    uses: ./.github/workflows/compile.yml

  unit:
    needs: [lint, compile]
    uses: ./.github/workflows/unit.yml

  # Under observation — the result is visible but not part of the verdict (build below) until it proves stable on shared runners.
  integration:
    needs: [lint, compile]
    uses: ./.github/workflows/integration.yml

  # The verdict. The main ruleset's required check and the implement skill look for this name (build). Checks of called
  # workflows are named "caller job / called job", so the results are gathered into this one job. Fails when any of them
  # failed, was cancelled or was skipped.
  build:
    if: ${{ !cancelled() }}
    needs: [lint, compile, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check that static checks, build and unit tests passed
        env:
          RESULTS: lint=${{ needs.lint.result }} compile=${{ needs.compile.result }} unit=${{ needs.unit.result }}
        run: |
          echo "$RESULTS"
          for R in $RESULTS; do
            case "$R" in *=success) ;; *) echo "::error::$R"; exit 1;; esac
          done
