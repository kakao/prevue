# Called by Verify (build.yml) — integration tests: the real layoutlib renders fixtures/pearl · pearl-kmp.
# The tests run one after another in a single JVM, which takes over 20 minutes on one runner — the classes are split into
# shards that run on several runners at once.
name: Verify — integration tests

on:
  workflow_call:

defaults:
  run:
    shell: sh

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [render, insets, kmp]
    env:
      # The classes each shard runs. Picking a shard checks that every test class is in exactly one shard, so a new class
      # cannot drop out silently. The first class of a shard pays for the fixture's first Gradle run. Split by per-class
      # duration (the two KMP classes share the KMP fixture setup).
      SHARDS: |
        render: RenderIntegrationTest ShadowedOverloadRenderIntegrationTest HotCompilerJarIntegrationTest
        insets: InsetsIntegrationTest InfraIntegrationTest BlankRenderIntegrationTest NoPreloadRenderIntegrationTest
        kmp: KmpInsetsIntegrationTest KmpRenderIntegrationTest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Pick this shard's classes
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, pathlib, sys
          shards = dict(line.split(":", 1) for line in os.environ["SHARDS"].strip().splitlines())
          shards = {k.strip(): v.split() for k, v in shards.items()}
          src = pathlib.Path("plugin/daemon/daemon/src/integrationTest/kotlin")
          declared = sorted(set(re.findall(r"^(?:internal |open )*class (\w+IntegrationTest)\b", "\n".join(p.read_text() for p in src.rglob("*.kt")), re.M)))
          assigned = sorted(c for cs in shards.values() for c in cs)
          if declared != assigned:
              print(f"::error::shard assignment does not match the test classes — declared {declared} · assigned {assigned}", file=sys.stderr)
              sys.exit(1)
          print("tests=" + " ".join(f"--tests prevue.daemon.{c}" for c in shards[os.environ["SHARD"]]))
          PY

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The wrappers and dependencies of both the daemon and the fixtures land in the same Gradle home; the key is all their
      # build files. Shards download different things (only the KMP shard gets KMP dependencies), so each saves its own.
      - name: Restore the Gradle home cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: integration-gradle-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('plugin/daemon/**/*.gradle.kts', 'plugin/daemon/**/libs.versions.toml', 'plugin/daemon/**/gradle-wrapper.properties', 'fixtures/pearl/**/*.gradle.kts', 'fixtures/pearl/**/libs.versions.toml', 'fixtures/pearl/**/gradle-wrapper.properties', 'fixtures/pearl-kmp/**/*.gradle.kts', 'fixtures/pearl-kmp/**/libs.versions.toml', 'fixtures/pearl-kmp/**/gradle-wrapper.properties') }}
          restore-keys: |
            integration-gradle-${{ matrix.shard }}-${{ runner.os }}-
            integration-gradle-${{ runner.os }}-

      # The fixtures use compileSdk 37. The tests look for android.jar under ANDROID_HOME's platforms.
      # The runner image ships android-37.0 (checked 2026-11) — on an image without it, install it.
      - name: Set up the Android platform
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" >/dev/null
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Integration tests
        working-directory: plugin/daemon
        env:
          PREVUE_JDK: ${{ env.JAVA_HOME }}
        run: ./gradlew :daemon:integrationTest ${{ steps.shard.outputs.tests }} --no-daemon

      # Without the toolchain or the SDK the tests skip quietly and go green — that counts as a failure, not a result.
      - name: Check that the tests actually ran
        if: always()
        run: |
          set -eu
          python3 tools/test-summary.py || true
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in glob.glob("plugin/daemon/daemon/build/test-results/integrationTest/TEST-*.xml")]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"classes {len(suites)} · tests {tests} · skipped {skipped}")
          if tests == 0 or skipped:
              print("::error::the integration tests did not run, or some were skipped")
              sys.exit(1)
          PY

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.shard }}
          path: |
            plugin/daemon/daemon/build/test-results/integrationTest
            plugin/daemon/daemon/build/reports/tests/integrationTest
          if-no-files-found: ignore

      # Keep what was downloaded even when the tests fail, so the next run starts warm. Skipped when the key already exists.
      - name: Save the Gradle home cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
