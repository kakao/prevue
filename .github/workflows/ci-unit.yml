name: CI — unit tests

on:
  workflow_call:
    inputs:
      save-cache:
        description: "Save the Gradle home cache (the cache-warm run on develop). CI only reads it."
        type: boolean
        default: false

defaults:
  run:
    shell: sh

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    permissions:
      contents: read
      actions: write
    # Ubuntu 26.04 has no Python 3.9 build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The CLI runs on macOS's default python3 (3.9).
      - name: Set python3 to 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: CLI verdict unit tests
        run: python3 -m unittest discover -s tests/cli

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"      # same as the users' minimum JDK. Bytecode 17 is pinned by build-logic's convention plugin (prevue.jvm)

      # A PR's own cache is visible to that PR alone, so CI only reads; cache-warm.yml saves on develop.
      - name: Gradle home cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-unit-${{ runner.os }}-${{ hashFiles('plugin/daemon/**/*.gradle.kts', 'plugin/daemon/**/libs.versions.toml', 'plugin/daemon/**/gradle-wrapper.properties') }}
          restore-keys: gradle-unit-${{ runner.os }}-

      - name: Daemon unit tests
        working-directory: plugin/daemon
        run: sh ../../tools/ci-retry.sh ./gradlew test --no-daemon

      # Only on success: a half-filled cache would stay under this key until the build files change.
      - name: Save the Gradle home cache
        if: ${{ success() && inputs.save-cache && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Must stay the last step: a step after it would end the failed job as cancelled, hiding the cause.
      # continue-on-error: a fork PR's token is read-only and cannot cancel.
      - name: Cancel the run, this job failed
        if: ${{ failure() && !inputs.save-cache && github.event_name == 'none' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel "${{ github.run_id }}"
