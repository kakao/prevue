# Release — run by hand on develop once the release PR (develop → main) carries both merge conditions: Verify's verdict
# (ci-success) and the skill evaluation certificate (the "스킬 평가" commit status), both left on the PR head by /ship.
# Merges that PR with a merge commit, then leaves the tag and the GitHub Release on the merge commit.
# main is what users install: both marketplaces read the plugin from the main branch, so the merge is the shipping moment.
# The main ruleset enforces the two checks on any merge; this workflow looks at them first only to stop with a clear
# message. It runs no verification itself — the PR's Verify run already checked this exact commit.
#
#   gh workflow run release.yml --ref develop                    release
#   gh workflow run release.yml --ref <branch> -f dry_run=true     print what would happen; never merges, tags or releases
#
# Safe to run again: with the tag already there it does nothing; with develop's head already merged into main but untagged
# (a run that failed after the merge, or a PR merged by hand) it only tags and releases. On any ref other than develop it
# is a dry run.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would happen, without merging, tagging or releasing.
        type: boolean
        default: false

concurrency:
  # One release at a time, and never cancel one halfway — a cancelled run could stop between the merge and the tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # pushes the tag, creates the Release
      pull-requests: write   # merges the release PR
      checks: read           # reads ci-success on the PR head
      statuses: read         # reads 스킬 평가 on the PR head
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # needs the tags and main

      # Reads facts only. Decides at run time, so re-running the job sees the state as it is now.
      - name: Decide
        id: decide
        run: |
          set -eu
          DRY=0
          if [ "$DRY_RUN" = true ] || [ "$GITHUB_REF" != refs/heads/develop ]; then DRY=1; fi
          # In a dry run every stop is reported and the run goes on, so one run shows all of them.
          stop() { if [ "$DRY" = 1 ]; then echo "::warning::would stop — $1"; else echo "::error::$1"; exit 1; fi; }
          REPO="$GITHUB_REPOSITORY"

          NEXT="$(tr -d ' \t\r\n' < plugin/VERSION)"
          git fetch -q origin main
          MAIN_VER="$(git show origin/main:plugin/VERSION | tr -d ' \t\r\n')"
          PR=""
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then STATE=tagged
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then STATE=merged
          else
            STATE=ready
            # A version already on main but untagged means the release was merged and develop has moved on since.
            # Merging again would ship unreviewed work under the old number.
            if [ "$(printf '%s\n%s\n' "$MAIN_VER" "$NEXT" | sort -V | tail -1)" = "$MAIN_VER" ]; then
              stop "develop's version $NEXT is not above main's $MAIN_VER — push the version commit first (/ship). If v$MAIN_VER was merged but never tagged, tag its merge commit by hand"
            fi
            sh tools/sync-version.sh --check || stop "versions are out of sync — run tools/sync-version.sh in the version commit"

            # --head matches the branch name only, so a fork's develop could match too — keep same-repository PRs.
            PR="$(gh pr list --base main --head develop --state open --json number,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')"
            if [ -z "$PR" ]; then
              stop "no open release PR (develop → main) — /ship opens it so that Verify runs on it"
            else
              HEAD="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
              [ "$HEAD" = "$GITHUB_SHA" ] || stop "release PR #$PR head is $HEAD, not this run's $GITHUB_SHA — run Release again"
              CI="$(gh api "repos/$REPO/commits/$GITHUB_SHA/check-runs?check_name=ci-success" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")][0].conclusion // "missing"')"
              [ "$CI" = success ] || stop "Verify's ci-success on $GITHUB_SHA is $CI"
              # Statuses are listed newest first, so the first match is the current one.
              EVAL="$(gh api "repos/$REPO/commits/$GITHUB_SHA/statuses" \
                --jq '[.[] | select(.context == "스킬 평가")][0].state // "missing"')"
              [ "$EVAL" = success ] || stop "스킬 평가 on $GITHUB_SHA is $EVAL — /ship runs the evaluation and posts it"
            fi
          fi

          PUBLISH=false
          if [ "$STATE" != tagged ] && [ "$DRY" = 0 ]; then PUBLISH=true; fi
          { echo "next=$NEXT"; echo "state=$STATE"; echo "pr=$PR"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"
          {
            echo "## v$NEXT — $STATE"; echo
            case "$STATE" in
              tagged) echo "v$NEXT is already tagged — nothing to do." ;;
              merged) echo "$GITHUB_SHA is already in main — tag and release only." ;;
              ready)  echo "Merge release PR #${PR:-?} at $GITHUB_SHA into main, then tag and release." ;;
            esac
            if [ "$DRY" = 1 ]; then echo; echo "Dry run ($GITHUB_REF) — nothing is merged, tagged or released."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Merges only the commit that was checked: the API refuses when the PR head is no longer that sha.
      # If the merge is refused for lack of permission, merge the PR by hand with a merge commit and run Release again.
      - name: Merge the release PR
        if: ${{ steps.decide.outputs.publish == 'true' && steps.decide.outputs.state == 'ready' }}
        env:
          PR: ${{ steps.decide.outputs.pr }}
        run: |
          set -eu
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f merge_method=merge -f sha="$GITHUB_SHA" --jq .sha
          echo "Merged #$PR"

      - name: Push the tag
        if: ${{ steps.decide.outputs.publish == 'true' }}
        env:
          NEXT: ${{ steps.decide.outputs.next }}
        run: |
          set -eu
          git fetch -q origin main
          # The release's merge commit: the oldest commit on main's first-parent line that contains this run's commit —
          # or the commit itself when develop was fast-forwarded to a merge commit on that line.
          if git rev-list --first-parent origin/main | grep -qx "$GITHUB_SHA"; then MERGE="$GITHUB_SHA"
          else MERGE="$(git rev-list --first-parent --ancestry-path --reverse "$GITHUB_SHA..origin/main" | head -1)"; fi
          [ -n "$MERGE" ] || { echo "::error::$GITHUB_SHA is not in main"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEXT" -m "v$NEXT" "$MERGE"
          git push origin "refs/tags/v$NEXT"
          echo "Tagged $MERGE as v$NEXT"

      # Creating a Release mails everyone who watches the repository for Releases. GitHub only reports failures by default.
      # The tag is already out, so a failure here is not rolled back — the failure mail points at this step.
      - name: Create the GitHub Release
        if: ${{ steps.decide.outputs.publish == 'true' }}
        env:
          NEXT: ${{ steps.decide.outputs.next }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Wrap the body as a JSON string with awk — the same POSIX tools sync-version.sh uses.
          BODY="$(awk -v v="## [$NEXT]" 'index($0,v)==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md \
            | awk 'BEGIN { ORS = "" } { gsub(/\\/, "\\\\"); gsub(/"/, "\\\""); gsub(/\t/, "\\t"); gsub(/\r/, ""); if (NR > 1) print "\\n"; print }')"
          printf '{"tag_name":"v%s","name":"v%s","body":"%s"}' "$NEXT" "$NEXT" "$BODY" > release.json
          CODE="$(curl -sS -o release.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            --data @release.json "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases")"
          [ "$CODE" = 201 ] || { echo "::error::tag v$NEXT is out but the Release could not be created ($CODE)"; cat release.out; exit 1; }
          echo "Created Release v$NEXT"
          {
            echo "## v$NEXT"; echo
            awk -v v="## [$NEXT]" 'index($0,v)==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
          } >> "$GITHUB_STEP_SUMMARY"
