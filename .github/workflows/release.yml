# Release record — run by hand on main after the release PR (develop → main) is merged; leaves the tag and the GitHub Release.
# The single source of the version is plugin/VERSION — the version commit pushed straight to develop (/ship) bumps it and
# tools/sync-version.sh carries it over. main is what users install: both marketplaces read the plugin from the main branch,
# so merging is shipping. Verification therefore finished before the merge, in the release PR's Verify run (build.yml) and in
# /ship (version · tag · sync). This is only a record: a late or failed run does not affect anyone installing.
# Kept in its own file that PRs do not run — in the same file it would always show up as "skipped" on PR checks.
name: Release

on:
  # Does nothing when the tag for plugin/VERSION already exists.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # pushes the tag

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # needs the tags to see whether this one exists

      - name: Read the version to tag
        run: |
          set -eu
          NEXT="$(tr -d ' \t\r\n' < plugin/VERSION)"
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "v$NEXT is already tagged — nothing to do"; echo "RELEASE=0" >> "$GITHUB_ENV"; exit 0
          fi
          # main only moves through verified release PRs. Still, never tag a tree whose versions are out of sync.
          sh tools/sync-version.sh --check
          echo "RELEASE=1" >> "$GITHUB_ENV"

      - name: Push the tag
        if: ${{ env.RELEASE == '1' }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEXT" -m "v$NEXT"
          git push origin "refs/tags/v$NEXT"

      # Creating a Release mails everyone who watches the repository for Releases. GitHub only reports failures by default.
      # The tag is already out, so a failure here is not rolled back — the failure mail points at this step.
      - name: Create the GitHub Release
        if: ${{ env.RELEASE == '1' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Wrap the body as a JSON string with awk — the same POSIX tools sync-version.sh uses.
          BODY="$(awk -v v="## [$NEXT]" 'index($0,v)==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md \
            | awk 'BEGIN { ORS = "" } { gsub(/\\/, "\\\\"); gsub(/"/, "\\\""); gsub(/\t/, "\\t"); gsub(/\r/, ""); if (NR > 1) print "\\n"; print }')"
          printf '{"tag_name":"v%s","name":"v%s","body":"%s"}' "$NEXT" "$NEXT" "$BODY" > release.json
          CODE="$(curl -sS -o release.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            --data @release.json "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases")"
          [ "$CODE" = 201 ] || { echo "::error::tag v$NEXT is out but the Release could not be created ($CODE)"; cat release.out; exit 1; }
          echo "Created Release v$NEXT"

      - name: Write what was done
        if: ${{ always() }}
        run: |
          set -eu
          {
            if [ "${RELEASE:-}" = 1 ]; then
              echo "## v$NEXT"; echo
              awk -v v="## [$NEXT]" 'index($0,v)==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
            else
              echo "## v${NEXT:-?} — not tagged"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
