# Release record — runs when the release PR (develop → main) is merged, by hand or by /ship; leaves the tag and the
# GitHub Release.
# main is what users install: both marketplaces read the plugin from the main branch, so the merge itself is the shipping
# moment and this is only a record — a late or failed run does not affect anyone installing.
# Verification finished before the merge: the main ruleset requires Verify's verdict (ci-success) and the skill evaluation
# certificate (the "스킬 평가" status, posted by /ship) on the release PR, a merge commit, and a PR head that contains main —
# so the merged tree is exactly the verified develop tree. This run checks that once more before it tags.
# The version's single source is plugin/VERSION; tools/sync-version.sh carries it over in the version commit (/ship).
#
#   (merge into main)                                            tags and releases
#   gh workflow run release.yml --ref main                       run again — does nothing when the tag exists
#   gh workflow run release.yml --ref <branch> -f dry_run=true     print what would happen; never tags or releases
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would happen, without tagging or releasing.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write     # pushes the tag, creates the Release
    env:
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # needs the tags and both parents of the merge commit

      - name: Decide
        id: decide
        run: |
          set -eu
          DRY=0
          if [ "${DRY_RUN:-false}" = true ] || [ "$GITHUB_REF" != refs/heads/main ]; then DRY=1; fi
          # In a dry run every stop is reported and the run goes on, so one run shows all of them.
          stop() { if [ "$DRY" = 1 ]; then echo "::warning::would stop — $1"; else echo "::error::$1"; exit 1; fi; }

          NEXT="$(tr -d ' \t\r\n' < plugin/VERSION)"
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "v$NEXT is already tagged — nothing to do"
            { echo "next=$NEXT"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            echo "## v$NEXT — already tagged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sh tools/sync-version.sh --check || stop "versions are out of sync — the version commit missed tools/sync-version.sh"
          # A release merge has develop's head as its second parent and the same tree — anything else did not come
          # through a verified release PR, so it gets no tag.
          if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            stop "$GITHUB_SHA is not a merge commit — main moved without a release PR"
          elif [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            stop "merge commit $GITHUB_SHA differs from its PR head — the merged tree was not the verified one"
          fi

          PUBLISH=true
          if [ "$DRY" = 1 ]; then PUBLISH=false; fi
          { echo "next=$NEXT"; echo "publish=$PUBLISH"; } >> "$GITHUB_OUTPUT"
          {
            echo "## v$NEXT"; echo
            if [ "$DRY" = 1 ]; then echo "Dry run ($GITHUB_REF) — would tag $GITHUB_SHA as v$NEXT and release it."
            else echo "Tag $GITHUB_SHA as v$NEXT and release it."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the tag
        if: ${{ steps.decide.outputs.publish == 'true' }}
        env:
          NEXT: ${{ steps.decide.outputs.next }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEXT" -m "v$NEXT" "$GITHUB_SHA"
          git push origin "refs/tags/v$NEXT"

      # Creating a Release mails everyone who watches the repository for Releases. GitHub only reports failures by default.
      # The tag is already out, so a failure here is not rolled back — the failure mail points at this step.
      - name: Create the GitHub Release
        if: ${{ steps.decide.outputs.publish == 'true' }}
        env:
          NEXT: ${{ steps.decide.outputs.next }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Wrap the body as a JSON string with awk — the same POSIX tools sync-version.sh uses.
          BODY="$(awk -v v="## [$NEXT]" 'index($0,v)==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md \
            | awk 'BEGIN { ORS = "" } { gsub(/\\/, "\\\\"); gsub(/"/, "\\\""); gsub(/\t/, "\\t"); gsub(/\r/, ""); if (NR > 1) print "\\n"; print }')"
          printf '{"tag_name":"v%s","name":"v%s","body":"%s"}' "$NEXT" "$NEXT" "$BODY" > release.json
          CODE="$(curl -sS -o release.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            --data @release.json "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases")"
          [ "$CODE" = 201 ] || { echo "::error::tag v$NEXT is out but the Release could not be created ($CODE)"; cat release.out; exit 1; }
          echo "Created Release v$NEXT"
          {
            echo; awk -v v="## [$NEXT]" 'index($0,v)==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
          } >> "$GITHUB_STEP_SUMMARY"
