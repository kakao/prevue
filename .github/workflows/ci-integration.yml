name: CI — integration tests

on:
  workflow_call:
    inputs:
      save-cache:
        description: "Save the Gradle home cache (the cache-warm run on develop). CI only reads it."
        type: boolean
        default: false

defaults:
  run:
    shell: sh

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [render, insets, kmp]
    env:
      # Every test class must be in exactly one shard, so a new class cannot drop out silently.
      # Balanced by per-class duration; the slowest shard sets the wall-clock time, so render holds RenderIntegrationTest alone.
      SHARDS: |
        render: RenderIntegrationTest
        insets: StaleBoundsIntegrationTest LoadingIndicatorIntegrationTest InsetsIntegrationTest LegacyWindowIntegrationTest InfraIntegrationTest BlankRenderIntegrationTest NoPreloadRenderIntegrationTest TimeGlyphsIntegrationTest HotCompilerJarIntegrationTest ShadowedOverloadRenderIntegrationTest
        kmp: KmpInsetsIntegrationTest KmpRenderIntegrationTest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Pick this shard's classes
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, pathlib, sys
          shards = dict(line.split(":", 1) for line in os.environ["SHARDS"].strip().splitlines())
          shards = {k.strip(): v.split() for k, v in shards.items()}
          src = pathlib.Path("plugin/daemon/daemon/src/integrationTest/kotlin")
          declared = sorted(set(re.findall(r"^(?:internal |open )*class (\w+IntegrationTest)\b", "\n".join(p.read_text() for p in src.rglob("*.kt")), re.M)))
          assigned = sorted(c for cs in shards.values() for c in cs)
          if declared != assigned:
              print(f"::error::shard assignment does not match the test classes — declared {declared} · assigned {assigned}", file=sys.stderr)
              sys.exit(1)
          print("tests=" + " ".join(f"--tests prevue.daemon.{c}" for c in shards[os.environ["SHARD"]]))
          PY

      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore the Gradle home cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: integration-gradle-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('plugin/daemon/**/*.gradle.kts', 'plugin/daemon/**/libs.versions.toml', 'plugin/daemon/**/gradle-wrapper.properties', 'fixtures/pearl/**/*.gradle.kts', 'fixtures/pearl/**/libs.versions.toml', 'fixtures/pearl/**/gradle-wrapper.properties', 'fixtures/pearl-kmp/**/*.gradle.kts', 'fixtures/pearl-kmp/**/libs.versions.toml', 'fixtures/pearl-kmp/**/gradle-wrapper.properties') }}
          restore-keys: |
            integration-gradle-${{ matrix.shard }}-${{ runner.os }}-
            integration-gradle-${{ runner.os }}-

      - name: Set up the Android platform
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" >/dev/null
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Integration tests
        working-directory: plugin/daemon
        env:
          PREVUE_JDK: ${{ env.JAVA_HOME }}
        run: sh ../../tools/ci-retry.sh ./gradlew :daemon:integrationTest ${{ steps.shard.outputs.tests }} --no-daemon

      # Without the toolchain or the SDK the tests skip and go green.
      - name: Check that the tests actually ran
        if: always()
        run: |
          set -eu
          python3 tools/test-summary.py || true
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in glob.glob("plugin/daemon/daemon/build/test-results/integrationTest/TEST-*.xml")]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"classes {len(suites)} · tests {tests} · skipped {skipped}")
          if tests == 0 or skipped:
              print("::error::the integration tests did not run, or some were skipped")
              sys.exit(1)
          PY

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.shard }}
          path: |
            plugin/daemon/daemon/build/test-results/integrationTest
            plugin/daemon/daemon/build/reports/tests/integrationTest
          if-no-files-found: ignore

      # Only on success: a half-filled cache would stay under this key until the build files change.
      - name: Save the Gradle home cache
        if: ${{ success() && inputs.save-cache && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
