# Fills the Gradle caches that Verify only reads. A work PR reads the caches of its base branch, so develop is warmed on every
# push; the release PR (develop → main) runs cold. The jobs are the Verify jobs themselves — what they download is what
# Verify needs, and a job saves its cache only when it passed. Unlike Verify there is no fail-fast: a failed job must not
# stop the others from saving. A failed job is rerun with `gh run rerun --failed`. Once this file is on main,
# workflow_dispatch rebuilds a cache that was evicted (10GB per repository, unused for 7 days).
name: Cache warm

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  compile:
    uses: ./.github/workflows/compile.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  unit:
    uses: ./.github/workflows/unit.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  integration:
    uses: ./.github/workflows/integration.yml
    with:
      save-cache: true
