# Fills the Gradle caches that Verify only reads. A PR can read the caches of its base branch and the default branch, so
# develop (work PRs) and main (the release PR, whose base is the default branch) are warmed on every push. The jobs are the
# Verify jobs themselves — what they download is what Verify needs, and the cache is saved only when the whole job passed.
# Run it by hand (workflow_dispatch) to rebuild a cache that was evicted (10GB per repository, unused for 7 days).
name: Cache warm

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
  pull_request:   # TEMP — 검증용, 최종 커밋에서 뺀다
    paths: ['.github/workflows/cache-warm.yml']

permissions:
  contents: read

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  compile:
    uses: ./.github/workflows/compile.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  unit:
    needs: [lint, compile]
    uses: ./.github/workflows/unit.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  integration:
    needs: [lint, compile]
    uses: ./.github/workflows/integration.yml
    with:
      save-cache: true
