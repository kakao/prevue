# A work PR reads the caches of its base branch, so develop is warmed on every push.
# No fail-fast here: a failed job must not stop the others from saving.
name: Cache warm

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: false   # a merge during a run must not cancel it — back-to-back merges left develop's cache half-filled

jobs:
  lint:
    uses: ./.github/workflows/ci-static.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  compile:
    uses: ./.github/workflows/ci-build.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  unit:
    uses: ./.github/workflows/ci-unit.yml
    with:
      save-cache: true
    permissions:
      contents: read
      actions: write

  integration:
    uses: ./.github/workflows/ci-integration.yml
    with:
      save-cache: true
