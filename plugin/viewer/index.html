<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prevue</title>
<link rel="icon" href="prevue.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="resize.css">
<link rel="stylesheet" href="preparation.css">
</head>
<body>
<script>if (new URL(location.href).searchParams.has('prepare')) document.body.classList.add('preparing');</script>
<!-- 헤더는 프로젝트 한 줄이다(D-98) — 어느 앱 · 무슨 일이. 어느 파일인지는 왼쪽 레일의 지금 줄이 말한다 — 파일명을 두 번 쓰지 않는다. -->
<header class="bar" id="bar">
  <div class="bar-row">
    <div class="bar-l">
      <!-- 워드마크(D-60) — 메뉴 막대의 앱 이름 자리. 브라우저에는 메뉴 막대가 없어 Prevue 가 말할 곳이 여기다.
           단색 · 앱 이름보다 작고 옅게 — 주인공은 여전히 대상 앱이고 색은 그 아이콘에만 둔다. 누르는 것이 아니다. -->
      <span class="brand" id="brand" title="Prevue">
        <svg viewBox="0 0 240 240" aria-hidden="true"><polygon points="120,40 189.3,80 120,120 50.7,80" fill="currentColor"/><polygon points="189.3,80 189.3,160 120,200 120,120" fill="currentColor" opacity=".62"/><polygon points="50.7,80 120,120 120,200 50.7,160" fill="currentColor" opacity=".34"/><path d="M14 44V14H44M14 196V226H44M226 44V14H196M226 196V226H196" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-name">Prevue</span>
      </span>
      <span class="brand-sep" aria-hidden="true"></span>
      <!-- 주인공은 대상 앱(B1) — 폰에서 보이는 런처 아이콘 · 이름이 제목, 폴더 · 브랜치 · 모듈 · 변형이 부제다(macOS 창 제목 + 부제).
           아이콘을 못 읽으면 이름 첫 글자 타일(B7). 부제에서 누를 수 있는 칸(폴더 · 브랜치)만 올리면 바탕이 생긴다(Xcode 스킴 선택기). -->
      <div class="app" id="app">
        <span class="app-tile" id="appTile" aria-hidden="true"></span>
        <img class="app-icon" id="appIcon" alt="" hidden>
        <span class="app-badge" id="appBadge" role="img" hidden></span>
        <div class="app-t">
          <div class="app-name" id="appName"></div>
          <div class="proj" id="proj">
            <button class="pj" id="pjDir" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="dirPop"></button><button class="pj pj-br" id="pjBr" type="button" data-t-title="brand.copyBranch" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="3.5" r="1.5"/><circle cx="5" cy="12.5" r="1.5"/><circle cx="11" cy="5.5" r="1.5"/><path d="M5 5v6M11 7c0 2.5-6 2-6 4"/></svg><span id="pjBrName"></span></button><span class="pj-rest" id="pjRest"></span>
          </div>
        </div>
        <!-- 부제는 말줄임(overflow: hidden)이라 팝오버를 그 밖에 둔다. 가로 자리는 header.js 가 폴더 칸에 맞춘다. -->
        <div class="pop dir-pop" id="dirPop" role="dialog" data-t-aria-label="header.dir">
          <div class="dir-path" id="dirPath"></div>
          <div class="dir-act"><button type="button" id="dirCopy" data-t="header.dir.copy"></button><button type="button" id="dirReveal" data-t="header.dir.reveal"></button></div>
        </div>
      </div>
      <!-- 작업 공간(D-57)의 내비게이션 바 — 돌아갈 곳(파일 탭 이름)과 이 장의 이름. iOS 처럼 뒤로 버튼이 이전 화면의 제목을 갖는다. -->
      <button class="back" id="back" type="button" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg><span id="backName"></span>
      </button>
    </div>
    <!-- 이 장의 이름 두 줄(D-63) — 위 프리뷰 이름(name=), 아래 함수 이름(macOS 창 제목 + 부제). 이름이 없으면 함수 이름 한 줄. -->
    <div class="ws-title" id="wsTitle" hidden><span class="ws-name" id="wsName"></span><span class="ws-fn" id="wsFn"></span></div>
    <div class="bar-r" id="barR">
      <div class="status" id="status" tabindex="0" data-state="none">
        <span class="st-ic" aria-hidden="true">
          <svg class="i-ok" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>
          <svg class="i-busy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2.5a5.5 5.5 0 1 1-5.5 5.5"/></svg>
          <svg class="i-bad" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/><path class="mark" d="M8 4.8v3.8" stroke-width="1.7" stroke-linecap="round"/><circle class="mark" cx="8" cy="11.2" r=".95"/></svg>
        </span><span class="st-text" id="statusText"></span>
        <div class="pop" role="tooltip"><div class="note" id="note"></div><div class="who" id="who"></div><div class="settle" id="settle"></div><div class="timing" id="timing"></div><div class="where" id="where"></div></div>
      </div>
      <div class="seg" id="seg" hidden><button type="button" data-on="false" data-t="mode.view"></button><button type="button" data-on="true" data-t="mode.interact"></button></div>
      <button class="icon-btn" id="helpBtn" type="button" data-t-title="header.help.tip" data-t-aria-label="header.help" aria-haspopup="dialog" aria-expanded="false">?</button>
    </div>
  </div>
  <div class="progress"></div>
</header>

<!-- 열린 파일 레일(D-54 · D-98). 지금 파일은 떠 있는 바탕이 가리킨다. 작업 공간에서는 접힌다(D-99). 빠른 열기의 입구는 맨 아래 "파일 열기"와 / · ⌘K 다. -->
<nav class="rail" id="rail" data-t-aria-label="rail.title" hidden>
  <h4 class="rail-h" data-t="rail.title"></h4>
  <div class="rail-list" id="railList" role="tablist" aria-orientation="vertical"><div class="rail-glider" id="railGlider" hidden></div></div>
  <p class="rail-empty" id="railEmpty" data-t="rail.empty" hidden></p>
  <button class="rail-open" id="railOpen" type="button" data-t-title="rail.open.tip" data-t-aria-label="rail.open.label" aria-haspopup="listbox" aria-expanded="false" aria-controls="qoSheet"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg><span class="rail-open-t" data-t="rail.open"></span><kbd>⌘K</kbd></button>
</nav>

<!-- 그림이 소스보다 옛것이다. 보드와 한 장 모두에 걸리므로 두 섹션 밖에 둔다. -->
<div class="stalebar" id="staleBar"><div class="in"><div class="rows" id="staleRows"></div></div></div>
<aside class="build-notice" id="buildNotice" role="status" data-t="build.notice" hidden></aside>

<main>
  <!-- 시작 화면(D-63 · D-100) — 열린 탭이 없을 때. 빠른 열기의 상자(입력 · 최근 바뀐 · 최근 연 파일)를 막 없이 본문 가운데에 둔다 —
       오류가 아니라 할 수 있는 일 위에 선다. 상자는 quickopen.js 가 팔레트에서 옮겨 온다(한 벌). -->
  <section id="startView" class="start" hidden>
    <div class="start-in">
      <p class="start-lead" data-t="start.lead"></p>
    </div>
  </section>

  <!-- 빈 탭 — 탭의 파일이 지워졌거나 @Preview 를 잃었다. 옛 카드를 그 파일의 지금 모습인 척 두지 않는다. 프리뷰가 돌아오면 데몬이 다시 연다. -->
  <section id="vacantView" class="vacant" hidden>
    <p class="vacant-msg" id="vacantMsg"></p>
    <p class="vacant-hint" data-t="vacant.hint"></p>
  </section>

  <!-- 보드(FR-17) -->
  <section id="boardView" hidden>
    <div class="board" id="cards"></div>
  </section>

  <!-- 한 장(FR-18 진입 · FQN 지정) — 기기를 손에 쥔 작업 공간(D-57). 이름 · 출구 · 확대는 헤더가 갖고 무대에는 기기만 둔다. -->
  <section id="focusView" hidden>
    <div class="wrap">
<div class="resize-scene" id="resizeScene" hidden><div class="resize-geometry" id="resizeGeometry">

  <div class="unit" id="ua"><div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="shell"></div><div class="outline"></div><div class="stage"><img class="ly l0" alt=""><div class="veil"></div><img class="ly l1" alt=""><div class="crease"></div><div class="cam"></div></div><div class="tick t-top"></div><div class="tick t-bot"></div></div>
  <div class="unit" id="ub" hidden><div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="btn"></div><div class="shell"></div><div class="outline"></div><div class="stage"><img class="ly l0" alt=""><div class="veil"></div><img class="ly l1" alt=""><div class="crease"></div><div class="cam"></div></div><div class="tick t-top"></div><div class="tick t-bot"></div></div>
  <div class="ruler" id="ruler" hidden>
    <svg aria-hidden="true"><path class="ext" id="rlExt"/><path class="dim" id="rlDim"/></svg>
    <input class="rl-badge" id="rlW" type="text" inputmode="numeric" maxlength="4" data-t-aria-label="size.w.label" data-t-title="size.w.tip">
    <input class="rl-badge" id="rlH" type="text" inputmode="numeric" maxlength="4" data-t-aria-label="size.h.label" data-t-title="size.h.tip">
  </div>

  <div class="duo" id="duo" hidden>
    <div class="duo-base"><div class="duo-band"></div><div class="duo-scr"><img class="ly" alt=""><div class="cam"></div></div></div>
    <div class="btn"></div><div class="btn"></div>
    <svg class="duo-edge" aria-hidden="true"><defs><linearGradient id="duoSheen" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color: var(--device-gloss)"/><stop offset=".4" style="stop-color: var(--device-gloss-clear)"/><stop offset="1" style="stop-color: var(--device-gloss-shade)"/></linearGradient></defs><path class="outl"/><path class="houtl"/><path class="rim"/><path class="rimhi"/><path class="body"/><path class="sheen" stroke="url(#duoSheen)"/><path class="hinge"/><path class="hsheen" stroke="url(#duoSheen)"/><path class="ring"/><path class="ring hr"/></svg>
    <div class="duo-flap"><div class="duo-face"></div><div class="duo-dark"></div></div>
  </div>
  <div class="rig" id="rig" hidden>
    <div class="lift">
      <div class="plate"></div>
      <div class="base">
        <div class="clip"><img class="ly old" alt=""><div class="veil"></div><img class="ly neu" alt=""><div class="cast"></div><div class="cam"></div></div>
        <div class="edge bez"></div><div class="edge ring"></div>
      </div>
      <div class="leaf">
        <div class="clip face inner"><img class="ly old" alt=""><div class="veil"></div><img class="ly neu" alt=""><div class="shade"></div><div class="sheen"></div><div class="cam"></div></div>
        <div class="clip face outer"><img class="ly old" alt=""><div class="veil"></div><img class="ly neu" alt=""><div class="shade"></div><div class="sheen"></div><div class="cam"></div></div>
        <div class="edge bez"></div><div class="edge ring"></div>
      </div>
      <div class="crease"></div>
      <div class="tick r-top"></div><div class="tick r-bot"></div>
    </div>
  </div>
</div>
</div>
      <div class="stage" id="stage">
        <img id="shot" alt="preview">
        <div class="workspace-loading" id="workspaceLoading" role="status" hidden><span class="workspace-spinner" aria-hidden="true"></span><span id="workspaceLoadingText" data-t="workspace.loading"></span></div>
        <div class="box" id="box" hidden></div>
        <div class="box pick" id="pickBox" hidden><span class="tag"></span></div>
      </div>
    </div>
  </section>
</main>

<!-- 오류 · 잠깐의 알림. 보드와 한 장이 함께 쓴다 — 비어 있으면 안 보인다. 가리킨 결과는 박스 꼬리표가 말한다(D-101). -->
<div class="capsule" id="strip" role="status">
  <div class="cap-main"><div id="sel"></div><div class="log" id="log"></div></div>
</div>

<!-- 작업 공간의 검사 패널(D-99) — 레일이 접힌 자리 맞은편에 크기 · 기기 · 자세 · 확대가 위에서 아래로 선다. 무대는 세로를 다 쓰고 아래는 캡슐 자리다.
     칸 이름 · 윤곽 · dp 는 resize-scene.js 가 기기 표에서 채운다. 확대 줄은 맨 아래이고 배율 메뉴는 그 위로 열린다. -->
<aside class="panel" id="panel" data-t-aria-label="panel.label" hidden>
  <div class="pn-pick" id="pnPick" role="radiogroup" data-t-aria-label="panel.pick">
    <section class="pn-sec"><h4 class="pn-h" data-t="panel.size"></h4>
      <div class="pn-list">
        <button class="pn-it mono" type="button" role="radio" data-sel="original" data-t-title="size.original.tip">@Preview</button>
        <button class="pn-it" type="button" role="radio" data-sel="narrow" data-t-title="size.narrow.tip">320×640</button>
        <button class="pn-it" type="button" role="radio" data-sel="foldable" data-t-title="size.foldable.tip">673×841</button>
        <button class="pn-it" type="button" role="radio" data-sel="custom" data-t-title="size.custom.tip" data-t="size.custom"></button>
        <!-- 커스텀일 때만 그 행 아래에 펼친다. 끄는 동안은 틀만 따라오고 놓을 때 한 번 그린다(D-99). 눈금 위치는 resize-scene.js 가 값에서 잡는다 -->
        <div class="pn-sl" id="pnSl" role="group" data-t-aria-label="size.custom.label" hidden>
          <div class="sl" data-axis="w"><div class="sl-h"><span id="slWLb" data-t="size.w"></span><span class="v"><b></b><small>dp</small></span></div>
            <div class="sl-track"><span class="fill"></span><span class="tick" data-v="600"><i></i><em>600</em></span><span class="tick" data-v="840"><i></i><em>840</em></span>
              <span class="thumb" role="slider" tabindex="0" aria-labelledby="slWLb" aria-valuemin="240" aria-valuemax="1600"></span></div></div>
          <div class="sl" data-axis="h"><div class="sl-h"><span id="slHLb" data-t="size.h"></span><span class="v"><b></b><small>dp</small></span></div>
            <div class="sl-track"><span class="fill"></span><span class="tick" data-v="480"><i></i><em>480</em></span><span class="tick" data-v="900"><i></i><em>900</em></span>
              <span class="thumb" role="slider" tabindex="0" aria-labelledby="slHLb" aria-valuemin="240" aria-valuemax="1600"></span></div></div>
        </div>
      </div>
    </section>
    <section class="pn-sec"><h4 class="pn-h" data-t="panel.device"></h4>
      <div class="pn-list">
        <h5 class="pn-g">Android</h5>
        <button class="pn-it" type="button" role="radio" data-sel="s26"></button>
        <button class="pn-it" type="button" role="radio" data-sel="pixel9"></button>
        <button class="pn-it" type="button" role="radio" data-sel="fold8"></button>
        <button class="pn-it" type="button" role="radio" data-sel="ultra"></button>
        <button class="pn-it" type="button" role="radio" data-sel="pixelfold"></button>
        <button class="pn-it" type="button" role="radio" data-sel="tablet"></button>
        <h5 class="pn-g">iPhone</h5>
        <button class="pn-it" type="button" role="radio" data-sel="ip17"></button>
        <button class="pn-it" type="button" role="radio" data-sel="ipair"></button>
        <button class="pn-it" type="button" role="radio" data-sel="ip17pm"></button>
        <button class="pn-it" type="button" role="radio" data-sel="ipduo"></button>
      </div>
    </section>
  </div>
  <section class="pn-sec" id="devCtl" role="group" data-t-aria-label="posture.label" hidden><h4 class="pn-h" data-t="posture.title"></h4>
    <div class="pn-seg">
      <button class="pn-it" id="dcFold" type="button"><span id="dcFoldLb" data-t="posture.fold"></span></button>
      <button class="pn-it" id="dcRot" type="button"><span id="dcRotLb" data-t="posture.rotate"></span></button>
      <button class="pn-it" id="dcHinge" type="button" aria-pressed="true" data-t-title="posture.hinge" data-t="posture.hinge"></button>
    </div>
  </section>
  <!-- 확대는 늘 보인다(W4) — 숨은 제스처(핀치 · ⌘ + 휠)를 받치는 눈에 보이는 컨트롤. 배율의 100% 는 1dp = 1 CSS px(실제 크기)다.
       맞춤이 아니면 `맞춤` 단추가 살아나 처음 화면으로 돌린다. -->
  <div class="zoom at-fit" id="zoomCtl">
    <button type="button" id="zoomOutBtn" data-t-aria-label="zoom.out" data-t-title="zoom.out.tip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8h8"/></svg></button>
    <button type="button" id="zoomPct" class="z-pct" aria-haspopup="menu" aria-expanded="false">100%</button>
    <button type="button" id="zoomInBtn" data-t-aria-label="zoom.in" data-t-title="zoom.in.tip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8h8M8 4v8"/></svg></button>
    <span class="z-grow"></span>
    <button type="button" id="zoomFitBtn" class="z-fit" data-t-title="zoom.fit.tip" data-t="zoom.fit"></button>
    <div class="zoom-menu" id="zoomMenu" role="menu">
      <button type="button" role="menuitem" data-z="fit"><span data-t="zoom.fit"></span><kbd>0</kbd></button>
      <button type="button" role="menuitem" data-z="1" data-t="zoom.real"></button>
      <button type="button" role="menuitem" data-z="2">200%</button>
    </div>
  </div>
</aside>

<!-- 후보 고르기 — 가리킨 꼬리표에서 내려오는 팝오버(D-101). 자리는 point.js 가 꼬리표에서 잰다. -->
<div class="chooser" id="chooser" role="dialog" data-t-aria-label="choose.label" aria-hidden="true"></div>

<!-- 빠른 열기의 팔레트와 막(D-100) — 팔레트는 창 위 가운데에 뜨고, 막은 레일 오른쪽 본문을 가린다. -->
<div class="qo-curtain" id="qoCurtain" hidden></div>
<div class="qo-sheet" id="qoSheet" hidden>
  <div class="qo-col">
    <label class="qo-field">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="q" type="search" data-t-placeholder="quickopen.placeholder" autocomplete="off" spellcheck="false" data-t-aria-label="quickopen.field" aria-controls="qoIn">
      <kbd class="qo-esc" aria-hidden="true">esc</kbd>
    </label>
    <div class="qo-in" id="qoIn" role="listbox" data-t-aria-label="quickopen.list"></div>
    <div class="qo-hint">
      <span class="qo-keys" aria-hidden="true"><span data-t="quickopen.keys.move"></span><span data-t="quickopen.keys.open"></span><span data-t="quickopen.keys.close"></span></span>
      <span class="qo-term"><span data-t="quickopen.term"></span> <code>prevue show &lt;<span data-t="quickopen.term.file"></span>&gt;</code></span>
    </div>
  </div>
</div>

<!-- 단축키 도움말. 내용은 keys.js 의 표가 채운다 — 디스패치와 같은 표라 둘이 어긋나지 않는다. -->
<div class="scrim" id="help" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle" tabindex="-1">
    <div class="sheet-brand"><img src="prevue.svg" alt="">Prevue</div>
    <h2 id="helpTitle" data-t="help.title"></h2>
    <div class="sheet-body"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
