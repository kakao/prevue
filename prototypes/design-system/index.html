<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prevue 디자인 시스템</title>
<link rel="stylesheet" href="../../plugin/viewer/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--on-surface); font: var(--type-body-medium); }
  .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--space-12); padding: var(--space-12) var(--space-24);
         background: var(--surface-container); border-bottom: 1px solid var(--outline-variant); }
  .top h1 { margin: 0; font: var(--type-title-small); }
  .top .note { color: var(--on-surface-variant); font: var(--type-label-small); }
  .top .grow { flex: 1; }
  .sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 1px; background: var(--outline-variant); }
  .sheet { background: var(--surface); color: var(--on-surface); padding: var(--space-24); min-width: 0; }
  .sheet > h2 { margin: 0 0 var(--space-16); font: var(--type-title-medium); }
  section { margin-bottom: var(--space-40); }
  section > h3 { margin: 0 0 var(--space-12); font: var(--type-title-small); }
  section > p.lead { margin: 0 0 var(--space-12); color: var(--on-surface-variant); font: var(--type-body-small); }
  .box { background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--corner-large); padding: var(--space-16); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-8); }
  .stack { display: grid; gap: var(--space-12); }
  .meta { color: var(--on-surface-variant); font: var(--type-code-small); }

  /* 토큰 */
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-8); }
  .swatch { display: grid; grid-template-rows: 40px auto; border: 1px solid var(--outline-variant); border-radius: var(--corner-medium); overflow: hidden; background: var(--surface-container); }
  .swatch i { display: block; border-bottom: 1px solid var(--outline-variant); }
  .swatch div { padding: var(--space-6) var(--space-8); display: grid; gap: var(--space-2); }
  .swatch b { font: var(--type-label-medium); }
  .types .t { display: grid; grid-template-columns: 140px 1fr; gap: var(--space-12); align-items: baseline; padding: var(--space-8) 0; border-bottom: 1px solid var(--outline-variant); }
  .types .t:last-child { border-bottom: 0; }
  .types .t > span:last-child { overflow-wrap: anywhere; }
  .spaces .s { display: grid; grid-template-columns: 90px 1fr; gap: var(--space-12); align-items: center; }
  .spaces .s i { display: block; height: var(--space-12); background: var(--primary-container); border-radius: var(--corner-small); }
  .corners, .elevations { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: var(--space-16); }
  .corners div, .elevations div { height: 72px; display: grid; place-items: end start; padding: var(--space-8); background: var(--surface-container); }
  .corners div { border: 1px solid var(--outline); }
  .motion .m { display: grid; grid-template-columns: 170px 1fr; gap: var(--space-12); align-items: center; padding: var(--space-6) 0; }
  .motion .track { position: relative; height: var(--control-small); background: var(--surface-container-high); border-radius: var(--corner-full); }
  .motion .dot { position: absolute; top: var(--space-4); left: var(--space-4); width: 16px; height: 16px; border-radius: var(--corner-full); background: var(--on-surface); }
  .motion.play .dot { left: calc(100% - 20px); }
  /* 움직임 줄이기 — 견본도 토큰 규칙대로 이동을 빼고 같은 시간의 페이드만 보인다. */
  @media (prefers-reduced-motion: reduce) {
    .motion .dot { transition-property: opacity !important; }
    .motion.play .dot { left: var(--space-4); opacity: .3; }
  }
  .contrast table { width: 100%; border-collapse: collapse; font: var(--type-body-small); }
  .contrast th, .contrast td { text-align: left; padding: var(--space-4) var(--space-8); border-bottom: 1px solid var(--outline-variant); }
  .contrast th { color: var(--on-surface-variant); font: var(--type-label-medium); }
  .contrast td.n { font: var(--type-code-small); text-align: right; }
  .contrast .ok { color: var(--success); } .contrast .no { color: var(--error); } .contrast .na { color: var(--on-surface-variant); }

  /* 컴포넌트 */
  .btn { display: inline-flex; align-items: center; gap: var(--space-6); height: var(--control-large); padding: 0 var(--space-12); border-radius: var(--corner-medium);
         border: 1px solid var(--outline-variant); background: var(--surface-container); color: var(--on-surface); font: var(--type-label-large); cursor: pointer;
         transition: background var(--duration-short2) var(--easing-standard); }
  .btn:hover { background: var(--state-hover); }
  .btn:focus-visible, .ibtn:focus-visible, .tab:focus-visible, .line:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .btn.quiet { border-color: transparent; background: transparent; }
  .btn.quiet:hover { background: var(--state-hover); }
  .btn.small { height: var(--control-medium); padding: 0 var(--space-8); font: var(--type-label-medium); }
  .btn:disabled { color: var(--on-surface-disabled); background: transparent; border-color: var(--outline-variant); cursor: default; }
  .btn .key { font: var(--type-code-small); color: inherit; opacity: .7; }
  .ibtn { width: var(--control-large); height: var(--control-large); display: inline-grid; place-items: center; border: 0; border-radius: var(--corner-medium);
          background: transparent; color: var(--on-surface-variant); cursor: pointer; }
  .ibtn:hover { background: var(--state-hover); color: var(--on-surface); }
  .ibtn[aria-pressed="true"] { background: var(--primary-container); color: var(--on-surface); }
  .ibtn svg { width: 16px; height: 16px; }
  .tabs { display: flex; gap: var(--space-2); padding: var(--space-4); background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--corner-medium); overflow-x: auto; }
  .tab { display: inline-flex; align-items: center; gap: var(--space-6); height: var(--control-medium); padding: 0 var(--space-12); border: 0; border-radius: var(--corner-small);
         background: transparent; color: var(--on-surface-variant); font: var(--type-label-large); font-weight: var(--weight-regular); white-space: nowrap; cursor: pointer; }
  .tab:hover { background: var(--state-hover); color: var(--on-surface); }
  .tab[aria-selected="true"] { background: var(--primary-container); color: var(--on-surface); font-weight: var(--weight-semibold); }
  .tab .x { color: var(--on-surface-variant); font: var(--type-label-small); }
  .pill { display: inline-flex; align-items: center; gap: var(--space-6); height: var(--control-small); padding: 0 var(--space-8); border-radius: var(--corner-full);
          border: 1px solid var(--outline-variant); color: var(--on-surface); font: var(--type-label-medium); white-space: nowrap; }
  .pill .n { font: var(--type-code-small); }
  .pill.ok .mark { color: var(--success); } .pill.slow .n { color: var(--warning); }
  .pill.bad { background: var(--error-container); border-color: transparent; color: var(--error); }
  .pill .live { width: 8px; height: 8px; border-radius: var(--corner-full); background: var(--live); }
  .field { display: flex; align-items: center; gap: var(--space-8); height: var(--control-large); padding: 0 var(--space-8); border: 1px solid var(--outline); border-radius: var(--corner-medium); background: var(--surface-container); color: var(--on-surface-variant); }
  .field:focus-within { border-color: var(--on-surface); }
  .field input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--on-surface); font: var(--type-body-medium); outline: none; }
  .field input::placeholder { color: var(--on-surface-variant); }
  .field kbd { font: var(--type-code-small); color: var(--on-surface-variant); border: 1px solid var(--outline-variant); border-radius: var(--corner-small); padding: 0 var(--space-4); }
  .popover { width: min(100%, 300px); background: var(--surface-container); border-radius: var(--corner-medium); box-shadow: var(--elevation-3); padding: var(--space-8) 0; }
  .popover .ph { padding: var(--space-4) var(--space-12) var(--space-8); font: var(--type-label-medium); color: var(--on-surface-variant); }
  .popover .pr { display: flex; justify-content: space-between; gap: var(--space-12); padding: var(--space-4) var(--space-12); font: var(--type-body-small); }
  .popover .pr span:last-child { font: var(--type-code-small); line-height: inherit; }
  .popover hr { border: 0; border-top: 1px solid var(--outline-variant); margin: var(--space-4) 0; }
  .stagebg { position: relative; height: 240px; border-radius: var(--corner-large); overflow: hidden; background: var(--surface); border: 1px solid var(--outline-variant); }
  .stagebg .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .sheetbox { position: absolute; left: var(--space-24); right: var(--space-24); bottom: 0; background: var(--surface-container); border-radius: var(--corner-large) var(--corner-large) 0 0;
              box-shadow: var(--elevation-4); padding: var(--space-16); display: grid; gap: var(--space-8); }
  .sheetbox h4 { margin: 0; font: var(--type-title-small); }
  .sheetbox p { margin: 0; color: var(--on-surface-variant); font: var(--type-body-small); }
  .capsule-wrap { display: flex; justify-content: center; }
  .capsule { display: inline-flex; align-items: center; gap: var(--space-12); max-width: 100%; min-height: var(--control-xlarge); padding: var(--space-6) var(--space-6) var(--space-6) var(--space-16);
             background: var(--surface-container); border-radius: var(--corner-full); box-shadow: var(--elevation-3); font: var(--type-body-small); }
  .capsule span { min-width: 0; }
  .tipdemo { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-6); }
  .tooltip { display: inline-block; max-width: 260px; padding: var(--space-4) var(--space-8); border-radius: var(--corner-medium); background: var(--primary); color: var(--on-primary); font: var(--type-label-small); }
  .list { background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--corner-medium); padding: var(--space-4); }
  .line { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: var(--space-8); min-height: var(--control-large); padding: var(--space-4) var(--space-8);
          border-radius: var(--corner-small); cursor: pointer; }
  .line:hover { background: var(--state-hover); }
  .line[aria-selected="true"] { background: var(--primary-container); }
  .line svg { width: 16px; height: 16px; color: var(--on-surface-variant); }
  .line .name { font: var(--type-body-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .name small { display: block; color: var(--on-surface-variant); font: var(--type-code-small); overflow: hidden; text-overflow: ellipsis; }
  .line .count { color: var(--on-surface-variant); font: var(--type-code-small); }
  .cards { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-24); }
  .card { display: grid; gap: var(--space-8); }
  .card .frame { position: relative; border-radius: var(--corner-medium); overflow: hidden; background: var(--surface-container); box-shadow: var(--elevation-2); }
  .card .frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .card .pickbox { position: absolute; border: 2px solid var(--pick); background: var(--pick-container); border-radius: var(--corner-small); }
  .card .picktag { position: absolute; transform: translateY(-100%); margin-top: -4px; padding: 0 var(--space-6); border-radius: var(--corner-small); background: var(--pick); color: var(--on-pick); font: var(--type-code-small); line-height: 18px; white-space: nowrap; }
  .card.live .frame { outline: 2px solid var(--live); outline-offset: 3px; }
  .card.failed .frame { display: grid; place-items: center; padding: var(--space-16); background: var(--error-container); color: var(--on-surface); font: var(--type-code-small); text-align: center; box-shadow: none; border: 1px solid var(--outline-variant); }
  .card.failed .frame b { display: block; margin-bottom: var(--space-4); color: var(--error); font: var(--type-label-medium); }
  .card .cap { display: flex; justify-content: space-between; gap: var(--space-8); font: var(--type-label-medium); }
  .card .cap span:last-child { color: var(--on-surface-variant); font: var(--type-code-small); }
  @media (max-width: 640px) {
    .top, .sheet { padding-left: var(--space-16); padding-right: var(--space-16); }
    .types .t, .motion .m { grid-template-columns: 1fr; gap: var(--space-4); }
  }
</style>
</head>
<body>
<header class="top">
  <h1 data-t="title"></h1>
  <span class="note" data-t="note"></span>
  <span class="grow"></span>
  <button class="btn small" id="lang" type="button"></button>
</header>
<main class="sheets">
  <div class="sheet" data-theme="light"></div>
  <div class="sheet" data-theme="dark"></div>
</main>

<template id="sheet">
  <h2></h2>

  <section>
    <h3 data-t="color"></h3>
    <p class="lead" data-t="colorLead"></p>
    <div class="swatches"></div>
  </section>

  <section class="contrast">
    <h3 data-t="contrast"></h3>
    <p class="lead" data-t="contrastLead"></p>
    <table><thead><tr><th data-t="cFg"></th><th data-t="cBg"></th><th data-t="cNeed"></th><th class="n" data-t="cRatio"></th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h3 data-t="type"></h3>
    <div class="box types"></div>
  </section>

  <section>
    <h3 data-t="space"></h3>
    <div class="box stack spaces"></div>
  </section>

  <section>
    <h3 data-t="corner"></h3>
    <div class="corners"></div>
  </section>

  <section>
    <h3 data-t="elevation"></h3>
    <div class="elevations"></div>
  </section>

  <section class="motion">
    <h3 data-t="motion"></h3>
    <p class="lead" data-t="motionLead"></p>
    <div class="box"><div class="rows"></div><div class="row" style="margin-top: var(--space-12)"><button class="btn small play" type="button" data-t="play"></button></div></div>
  </section>

  <section>
    <h3 data-t="buttons"></h3>
    <div class="box stack">
      <div class="row">
        <button class="btn primary" type="button" data-t="bPrimary"></button>
        <button class="btn" type="button" data-t="bDefault"></button>
        <button class="btn quiet" type="button" data-t="bQuiet"></button>
        <button class="btn" type="button" disabled data-t="bDisabled"></button>
      </div>
      <div class="row">
        <button class="btn small" type="button"><span data-t="bOpen"></span><span class="key">⌘K</span></button>
        <button class="btn small quiet" type="button" data-t="bCopy"></button>
      </div>
    </div>
  </section>

  <section>
    <h3 data-t="iconButtons"></h3>
    <div class="box row">
      <button class="ibtn" type="button" data-tip="iSearch"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></button>
      <button class="ibtn" type="button" data-tip="iZoom" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M8 5.5v5M5.5 8h5"/></svg></button>
      <button class="ibtn" type="button" data-tip="iRotate"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg></button>
      <button class="ibtn" type="button" data-tip="iClose"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </section>

  <section>
    <h3 data-t="tabs"></h3>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" type="button">ForYouScreen.kt <span class="x">×</span></button>
      <button class="tab" role="tab" aria-selected="false" type="button">Button.kt <span class="x">×</span></button>
      <button class="tab" role="tab" aria-selected="false" type="button">SearchScreen.kt <span class="x">×</span></button>
    </div>
  </section>

  <section>
    <h3 data-t="pills"></h3>
    <div class="box row">
      <span class="pill"><span data-t="pCompiling"></span> <span class="n">ForYouScreen.kt</span></span>
      <span class="pill"><span class="n">3/8</span></span>
      <span class="pill ok"><span class="mark">✓</span><span class="n">0.84s</span></span>
      <span class="pill slow"><span class="mark">✓</span><span class="n">1.32s</span></span>
      <span class="pill bad" data-t="pFailed"></span>
      <span class="pill"><span class="live"></span><span data-t="pLive"></span></span>
    </div>
  </section>

  <section>
    <h3 data-t="input"></h3>
    <div class="box stack">
      <label class="field"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input data-ph="inputPh"><kbd>esc</kbd></label>
    </div>
  </section>

  <section>
    <h3 data-t="popover"></h3>
    <div class="popover">
      <div class="ph" data-t="popHead"></div>
      <div class="pr"><span data-t="popDetect"></span><span>12ms</span></div>
      <div class="pr"><span data-t="popCompile"></span><span>412ms</span></div>
      <div class="pr"><span data-t="popRender"></span><span>318ms</span></div>
      <hr>
      <div class="pr"><span data-t="popFirst"></span><span>0.84s</span></div>
      <div class="pr"><span data-t="popBoard"></span><span>2.10s</span></div>
    </div>
  </section>

  <section>
    <h3 data-t="sheetC"></h3>
    <div class="stagebg">
      <div class="scrim"></div>
      <div class="sheetbox">
        <h4 data-t="sheetTitle"></h4>
        <p data-t="sheetBody"></p>
        <div class="row"><button class="btn primary small" type="button" data-t="sheetGo"></button><button class="btn quiet small" type="button" data-t="sheetLater"></button></div>
      </div>
    </div>
  </section>

  <section>
    <h3 data-t="capsule"></h3>
    <div class="capsule-wrap"><div class="capsule"><span data-t="capText"></span><button class="btn small quiet" type="button" data-t="capUndo"></button></div></div>
  </section>

  <section>
    <h3 data-t="tooltip"></h3>
    <div class="tipdemo">
      <span class="tooltip" role="tooltip" data-t="tipText"></span>
      <button class="ibtn" type="button" data-tip="iZoom"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M8 5.5v5M5.5 8h5"/></svg></button>
    </div>
  </section>

  <section>
    <h3 data-t="list"></h3>
    <div class="list">
      <div class="line" tabindex="0" aria-selected="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h5l3 3v10H4z"/></svg><span class="name">ForYouScreen.kt<small>feature/foryou/impl/…/ForYouScreen.kt</small></span><span class="count">10</span></div>
      <div class="line" tabindex="0"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h5l3 3v10H4z"/></svg><span class="name">Button.kt<small>core/designsystem/…/component/Button.kt</small></span><span class="count">6</span></div>
      <div class="line" tabindex="0"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h5l3 3v10H4z"/></svg><span class="name">SearchScreen.kt<small>feature/search/impl/…/SearchScreen.kt</small></span><span class="count">2</span></div>
    </div>
  </section>

  <section>
    <h3 data-t="cardC"></h3>
    <p class="lead" data-t="cardLead"></p>
    <div class="cards">
      <div class="card"><div class="frame" style="width: 160px; height: 347px">
        <img src="img/ForYouScreenPopulatedFeed-0.png" alt="">
        <div class="pickbox" style="left: 8px; top: 64px; width: 144px; height: 120px"></div>
        <div class="picktag" style="left: 8px; top: 64px">ForYouScreen.kt:412</div>
      </div><div class="cap"><span>phone</span><span>411×891</span></div></div>
      <div class="card live"><div class="frame" style="width: 180px; height: 96px"><img src="img/NiaButtonPreview-0.png" alt=""></div><div class="cap"><span data-t="cardLive"></span><span>NiaButton</span></div></div>
      <div class="card failed"><div class="frame" style="width: 180px; height: 120px"><div><b data-t="cardFail"></b>IllegalStateException: CompositionLocal LocalNavController not present</div></div><div class="cap"><span>tablet</span><span>1280×800</span></div></div>
    </div>
  </section>
</template>

<script>
  // 길이 확인용 임시 문구다. 실제 영어 문구는 영어 버전 작업이 쓴다.
  const T = {
    ko: {
      title: "Prevue 디자인 시스템", note: "값은 plugin/viewer/tokens.css가 갖는다", lang: "English", light: "라이트", dark: "다크",
      color: "색", colorLead: "역할 이름과 이 면에서 풀린 값", contrast: "대비", contrastLead: "본문 글자 4.5:1, 큰 글자 · 조작 테두리 · 가리킨 박스 3:1. 구분선은 장식이라 면제", cFg: "앞", cBg: "뒤", cNeed: "기준", cRatio: "대비",
      type: "글자", space: "간격", corner: "모서리", elevation: "그림자", motion: "시간 · 이징", motionLead: "움직임 줄이기에서는 이동 · 확대만 빠지고 시간은 그대로다", play: "재생",
      sample: "저장하면 1초 안에 다시 그립니다",
      buttons: "버튼", bPrimary: "다시 그리기", bDefault: "파일 열기", bQuiet: "취소", bDisabled: "준비 중", bOpen: "빠른 열기", bCopy: "경로 복사",
      iconButtons: "아이콘 버튼", iSearch: "찾기", iZoom: "확대", iRotate: "돌리기", iClose: "닫기",
      tabs: "탭", pills: "알약", pCompiling: "컴파일 중…", pFailed: "렌더 실패", pLive: "조작 중",

      popover: "팝오버", popHead: "이번 저장", popDetect: "감지", popCompile: "컴파일", popRender: "렌더", popFirst: "첫 장", popBoard: "보드 8장",
      sheetC: "시트", sheetTitle: "빌드 설정을 읽어야 합니다", sheetBody: "Gradle을 한 번 실행해 클래스패스를 읽습니다. 사내 Maven에 요청이 나갑니다.", sheetGo: "읽기", sheetLater: "나중에",
      capsule: "캡슐", capText: "ForYouScreen.kt 탭을 닫았습니다", capUndo: "되돌리기",
      tooltip: "툴팁", tipText: "확대 · 축소 (⌘ + 휠)",
      list: "목록 줄", cardC: "카드 틀", cardLead: "가리킨 박스 · 조작 중 테 · 렌더 실패", cardLive: "조작 중", cardFail: "렌더 실패",
      exempt: "면제", text: "글자", large: "테두리",
    },
    en: {
      title: "Prevue design system", note: "Values live in plugin/viewer/tokens.css", lang: "한국어", light: "Light", dark: "Dark",
      color: "Color", colorLead: "Role names and the values they resolve to on this surface", contrast: "Contrast", contrastLead: "Body text 4.5:1; large text, control borders and the picked box 3:1. Dividers are decorative and exempt", cFg: "Foreground", cBg: "Background", cNeed: "Needs", cRatio: "Ratio",
      type: "Typography", space: "Spacing", corner: "Corners", elevation: "Elevation", motion: "Duration and easing", motionLead: "With reduced motion, movement and scaling are dropped; durations stay the same", play: "Play",
      sample: "Saves are redrawn in under a second",
      buttons: "Buttons", bPrimary: "Redraw previews", bDefault: "Open file", bQuiet: "Cancel", bDisabled: "Preparing", bOpen: "Quick open", bCopy: "Copy path",
      iconButtons: "Icon buttons", iSearch: "Search", iZoom: "Zoom", iRotate: "Rotate", iClose: "Close",
      tabs: "Tabs", pills: "Status pills", pCompiling: "Compiling…", pFailed: "Render failed", pLive: "Interacting",
      input: "Text field", inputPh: "File or preview name",
      popover: "Popover", popHead: "Last save", popDetect: "Detected", popCompile: "Compiled", popRender: "Rendered", popFirst: "First preview", popBoard: "All 8 previews",
      sheetC: "Sheet", sheetTitle: "Prevue needs to read your build setup", sheetBody: "Gradle runs once to read the classpath. This sends requests to your company Maven repository.", sheetGo: "Read build", sheetLater: "Not now",
      capsule: "Capsule", capText: "Closed the ForYouScreen.kt tab", capUndo: "Undo",
      tooltip: "Tooltip", tipText: "Zoom in and out (⌘ + scroll)",
      list: "List rows", cardC: "Card frame", cardLead: "Picked box, interacting outline, failed render", cardLive: "Interacting", cardFail: "Render failed",
      exempt: "exempt", text: "text", large: "border",
    },
  };

  const COLORS = ["surface", "surface-container", "surface-container-high", "state-hover", "primary-container", "on-surface", "on-surface-variant", "on-surface-disabled",
    "outline", "outline-variant", "primary", "on-primary", "focus-ring", "pick", "pick-container", "on-pick", "live", "error", "error-container", "warning", "success", "scrim",
    "device-body", "device-tone-s26", "device-tone-pixel9", "device-tone-fold8", "device-tone-ultra", "device-tone-pixelfold", "device-tone-tablet",
    "device-tone-ip17", "device-tone-ipair", "device-tone-ip17pm", "device-tone-ipduo"];
  const TYPES = ["display", "title-large", "title-medium", "title-small", "body-large", "body-medium", "body-small", "label-large", "label-medium", "label-small", "code", "code-small"];
  const SPACES = [2, 4, 6, 8, 12, 16, 20, 24, 32, 40, 48, 64];
  const CORNERS = ["small", "medium", "large", "full"];
  // [시간, 이징, 계단 칸 수] — 계단은 --motion-stagger 의 배수만큼 늦게 출발한다.
  const MOTIONS = [["short1", "standard"], ["short2", "standard"], ["short3", "standard"], ["short4", "standard"], ["medium1", "standard"],
    ["medium2", "standard"], ["medium2", "decelerate"], ["medium2", "accelerate"], ["long1", "standard"], ["long3", "standard"], ["long4", "standard"],
    ["extra-long2", "decelerate"], ["extra-long3", "standard"], ["extra-long4", "standard"],
    ["medium2", "standard", 2], ["medium2", "standard", 4], ["medium2", "standard", 6]];
  // [앞, 뒤, 기준] — 반투명한 뒤는 그 아래 면에 겹친 색으로 잰다.
  const PAIRS = [
    ["on-surface", "surface", 4.5], ["on-surface", "surface-container", 4.5], ["on-surface", "primary-container/surface-container", 4.5],
    ["on-surface-variant", "surface", 4.5], ["on-surface-variant", "surface-container", 4.5], ["on-surface-variant", "surface-container-high/surface-container", 4.5],
    ["on-primary", "primary", 4.5], ["on-pick", "pick", 4.5], ["error", "surface-container", 4.5], ["error", "error-container/surface-container", 4.5],
    ["warning", "surface-container", 4.5], ["warning", "surface", 4.5], ["success", "surface-container", 4.5],
    ["outline", "surface", 3], ["outline", "surface-container", 3], ["focus-ring", "surface", 3], ["pick", "surface-container", 3], ["live", "surface", 3],
    ["outline-variant", "surface-container", 0],
  ];

  let lang = "ko";
  const sheets = [...document.querySelectorAll(".sheet")];

  function resolve(sheet, role) {
    const probe = document.createElement("i");
    probe.style.cssText = `position:absolute;visibility:hidden;color:var(--${role})`;
    sheet.append(probe);
    const c = getComputedStyle(probe).color.match(/[\d.]+/g).map(Number);
    probe.remove();
    return { r: c[0], g: c[1], b: c[2], a: c.length > 3 ? c[3] : 1 };
  }
  const over = (top, under) => ({ r: top.r * top.a + under.r * (1 - top.a), g: top.g * top.a + under.g * (1 - top.a), b: top.b * top.a + under.b * (1 - top.a), a: 1 });
  const layered = (sheet, spec) => spec.split("/").reverse().map(r => resolve(sheet, r)).reduce((under, top) => over(top, under));
  const lum = c => [c.r, c.g, c.b].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }).reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0);
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
  const hex = c => "#" + [c.r, c.g, c.b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("") + (c.a < 1 ? Math.round(c.a * 255).toString(16).padStart(2, "0") : "");

  function build(sheet) {
    sheet.replaceChildren(document.getElementById("sheet").content.cloneNode(true));
    sheet.querySelector(".swatches").innerHTML = COLORS.map(n =>
      `<div class="swatch"><i style="background:var(--${n})"></i><div><b>--${n}</b><span class="meta" data-role="${n}"></span></div></div>`).join("");
    sheet.querySelector(".types").innerHTML = TYPES.map(n =>
      `<div class="t"><span class="meta">--type-${n}</span><span style="font:var(--type-${n})" data-t="sample"></span></div>`).join("");
    sheet.querySelector(".spaces").innerHTML = SPACES.map(n =>
      `<div class="s"><span class="meta">--space-${n}</span><i style="width:var(--space-${n})"></i></div>`).join("");
    sheet.querySelector(".corners").innerHTML = CORNERS.map(n =>
      `<div style="border-radius:var(--corner-${n})"><span class="meta">--corner-${n}</span></div>`).join("");
    sheet.querySelector(".elevations").innerHTML = [1, 2, 3, 4].map(n =>
      `<div style="box-shadow:var(--elevation-${n});border-radius:var(--corner-medium)"><span class="meta">--elevation-${n}</span></div>`).join("");
    sheet.querySelector(".motion .rows").innerHTML = MOTIONS.map(([d, e, k]) =>
      `<div class="m"><span class="meta">${d} · ${e}${k ? ` · stagger ×${k}` : ""}</span><div class="track"><i class="dot" style="transition:left var(--duration-${d}) var(--easing-${e})${k ? ` calc(var(--motion-stagger) * ${k})` : ""}"></i></div></div>`).join("");
    sheet.querySelector(".play").addEventListener("click", e => e.target.closest(".motion").classList.toggle("play"));
    sheet.querySelectorAll("[data-role]").forEach(el => { el.textContent = hex(resolve(sheet, el.dataset.role)); });
    sheet.querySelector(".contrast tbody").innerHTML = PAIRS.map(([fg, bg, need]) => {
      const r = ratio(layered(sheet, fg), layered(sheet, bg));
      const cls = need === 0 ? "na" : r >= need ? "ok" : "no";
      const needText = need === 0 ? `<span data-t="exempt"></span>` : `${need}:1 <span data-t="${need === 3 ? "large" : "text"}"></span>`;
      return `<tr><td>--${fg}</td><td>--${bg.split("/").join(" / ")}</td><td>${needText}</td><td class="n ${cls}">${r.toFixed(2)}</td></tr>`;
    }).join("");
  }

  function translate() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll("[data-ph]").forEach(el => { el.placeholder = t[el.dataset.ph]; });
    document.querySelectorAll("[data-tip]").forEach(el => { el.title = t[el.dataset.tip]; el.setAttribute("aria-label", t[el.dataset.tip]); });
    sheets.forEach(s => { s.querySelector("h2").textContent = t[s.dataset.theme]; });
    document.getElementById("lang").textContent = t.lang;
    document.title = t.title;
  }

  sheets.forEach(build);
  if (new URLSearchParams(location.search).get("lang") === "en") lang = "en";
  translate();
  document.getElementById("lang").addEventListener("click", () => { lang = lang === "ko" ? "en" : "ko"; translate(); });
</script>
