<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구조 시안 — 준비 화면</title>
<link rel="stylesheet" href="../../../plugin/viewer/tokens.css">
<link rel="stylesheet" href="draft.css">
<style>
  .ctl { display: flex; gap: var(--space-8); margin: 0 0 var(--space-16); flex-wrap: wrap; }
  .ctl button, .ctl a { height: var(--control-large); padding: 0 var(--space-12); display: inline-flex; align-items: center; border: 1px solid var(--outline); border-radius: var(--corner-medium);
    background: var(--surface-container); color: var(--on-surface); font: var(--type-label-large); cursor: pointer; text-decoration: none; }
  .ctl button[aria-pressed="true"] { background: var(--primary-container); }
  .live { width: 1440px; height: 900px; border: 0; display: block; }
  .frames .win { zoom: var(--draft-zoom, .55); width: 1440px; height: 900px; }
</style>
</head>
<body>
<div class="page-top">
  <h1 id="h1"></h1><span class="note" id="note"></span><span class="grow"></span>
  <a href="./">← 시안 목록</a><a id="lang" href="#"></a>
</div>
<div id="root"></div>
<script src="draft.js"></script>
<script>
  // 각 창은 실제 준비 화면 코드(preparation-scene.js)를 띄운 prepare-live.html 이다 — 그림 · 빛 띠 · 팔레트 · 모션이 실제와 같다
  const T = {
    ko: {
      h1: "준비 화면", note: "실제 준비 화면 코드로 돌리는 시제품 · 단계 길이만 줄였다(프로젝트 3.5초 · 환경 3.5초 · 그리기 3초 → 첫 프리뷰) · 화면이 아는 것은 단계 · 시작 시각 · 파일 · 실패 원인뿐이다",
      R1: "안 1 — 가운데 한 줄기 + 네 칸 막대",
      R1d: "지금 준비 화면 그대로에 제목 아래 <b>네 칸 막대</b>와 <b>지금 하는 일 · 지난 시간</b> 한 줄을 더했다. 막대의 지금 칸은 단계 안에서 차오른다.",
      R3: "안 3 — 왼쪽 단계 목록 + 오른쪽 그림",
      R3d: "그림을 오른쪽으로 옮기고 왼쪽에 <b>단계 목록</b>을 둔다. 끝난 단계 ✓, 지금 단계에 도는 테와 <b>설명 한 줄 · 지난 시간</b>, 실패하면 그 단계가 빨개지고 설명 자리에 원인.",
      replay: "다시 재생", fail: "실패로 보기", ok: "성공으로 보기", open: "새 창으로 열기", light: "라이트", dark: "다크",
    },
    en: {
      h1: "Preparation screen", note: "Live prototype on the real preparation code · only phase lengths are shortened (project 3.5s · environment 3.5s · drawing 3s → first preview) · the screen knows only phase, start time, file and failure cause",
      R1: "Option 1 — one centered column + four-segment bar",
      R1d: "Today's screen plus a <b>four-segment bar</b> and one <b>what's happening · elapsed</b> line under the title. The current segment fills during its phase.",
      R3: "Option 3 — step list on the left, art on the right",
      R3d: "The art moves right and a <b>step list</b> sits on the left: done steps ✓, the current step a spinner with <b>one description line and elapsed time</b>; on failure that step turns red and the cause replaces the description.",
      replay: "Replay", fail: "Show failure", ok: "Show success", open: "Open in a new window", light: "Light", dark: "Dark",
    },
  }[LANG];
  document.getElementById("h1").textContent = T.h1;
  document.getElementById("note").textContent = T.note;
  document.title = `${LANG === "ko" ? "구조 시안" : "Layout draft"} — ${T.h1}`;
  const q = new URLSearchParams(location.search);
  if (q.get("zoom") === "1") document.documentElement.style.setProperty("--draft-zoom", "1");
  const src = (layout, theme, fail) => `prepare-live.html?layout=${layout}&theme=${theme}${fail ? "&fail=1" : ""}${LANG === "en" ? "&lang=en" : ""}`;
  const failAll = q.get("fail") === "1";
  document.getElementById("root").innerHTML = [["R1", "1"]].map(([k, n]) => `<section class="variant" id="${k}"><h2>${T[k]}${LANG === "ko" ? " ✓ 확정" : " ✓ confirmed"}</h2><p class="diff">${T[k + "d"]}</p>
    <div class="ctl"><button type="button" data-act="replay">${T.replay}</button><button type="button" data-act="fail" aria-pressed="${failAll}">${failAll ? T.ok : T.fail}</button>
      <a href="${src(n, "light")}" target="_blank">${T.open}</a></div>
    <div class="frames">${["light", "dark"].map(th => `<figure><figcaption>${T[th]}</figcaption><div class="win wide" data-theme="${th}"><iframe class="live" data-layout="${n}" data-theme-name="${th}" src="${src(n, th, failAll)}"></iframe></div></figure>`).join("")}</div></section>`).join("");
  // 통일 비교 — 확정한 안 1 위에서 그림 색과 헤더 줄만 바꾼다
  const U = [["", LANG === "ko" ? "지금 그림 — 팔레트 색 + 빛 띠" : "Current art: palette colors + light ribbons"],
    ["&calm=1", LANG === "ko" ? "차분한 그림 — 같은 조각 · 같은 움직임, 색만 크롬과 같은 무채색, 빛 띠 없음" : "Calm art: same pieces and motion, neutral chrome colors, no ribbons"],
    ["&calm=1&frame=1", LANG === "ko" ? "차분한 그림 + 헤더 첫 줄 — 다른 화면과 같은 워드마크 줄" : "Calm art + header row: the same wordmark row as other screens"]];
  document.getElementById("root").insertAdjacentHTML("beforeend", `<section class="variant" id="U"><h2>${LANG === "ko" ? "통일 — 그림을 차분하게, 다른 화면과 같은 틀로" : "Unify: calmer art, same frame as other screens"}</h2>
    <p class="diff">${LANG === "ko" ? "확정한 안 1 위에서 비교한다. 조각이 모여 완성되는 움직임은 그대로 두고 <b>색과 배경</b>만 바꾼다. 무채색 단계는 tokens.css의 역할 이름(면 · 구분선 · 테두리)을 그대로 쓴다." : "Compared on confirmed option 1. The assembly motion stays; only <b>color and background</b> change, using tokens.css role names."}</p>
    <div class="ctl"><button type="button" data-act="replay">${T.replay}</button><button type="button" data-act="fail" aria-pressed="false">${T.fail}</button></div>
    <div class="frames">${U.map(([p, cap]) => ["light", "dark"].map(th => `<figure><figcaption>${cap} · ${T[th]}</figcaption><div class="win wide" data-theme="${th}"><iframe class="live" data-layout="1" data-theme-name="${th}" data-extra="${p}" src="${src("1", th, false)}${p}"></iframe></div></figure>`).join("")).join("")}</div></section>`);
  for (const sec of document.querySelectorAll(".variant")) {
    const frames = [...sec.querySelectorAll("iframe")], btn = sec.querySelector('[data-act="fail"]');
    sec.querySelector('[data-act="replay"]').addEventListener("click", () => frames.forEach(f => f.contentWindow.postMessage("replay", "*")));
    btn.addEventListener("click", () => {
      const on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", on); btn.textContent = on ? T.ok : T.fail;
      frames.forEach(f => { f.src = src(f.dataset.layout, f.dataset.themeName, on) + (f.dataset.extra || ""); });
    });
  }
  langButton();
</script>
</body>
</html>
