<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비 → 보드 전환 시제품</title>
<link rel="stylesheet" href="../../../plugin/viewer/tokens.css">
<link rel="stylesheet" href="../../../plugin/viewer/preparation.css">
<link rel="stylesheet" href="draft.css">
<style>
  /* 실제 준비 장면(preparation-scene.js) 아래에 확정한 보드(레일 + 흐르는 묶음)를 깔고, 넘어가는 방식만 바꾼다. ?mode=hero|fade|cursor|rise */
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .app { position: fixed; inset: 0; }
  .bd { display: flex; flex-wrap: wrap; gap: var(--space-32) var(--space-40); align-items: flex-start; padding: var(--space-20) var(--space-24); }
  .g .gh { display: flex; align-items: baseline; gap: var(--space-8); margin-bottom: var(--space-12); }
  .g .gh b { font: var(--type-title-small); }
  .g .gh span { color: var(--on-surface-variant); font: var(--type-label-small); }
  .cd .st { width: 240px; height: 520px; border-radius: var(--corner-medium); overflow: hidden; background: var(--surface-container); box-shadow: var(--elevation-1); }
  .cd .st img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .cd .lb { margin-top: var(--space-6); color: var(--on-surface-variant); font: var(--type-label-small); }
  .cd.cursor .st { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .cd.arrival .st { outline: 3px solid var(--arrival-color, var(--focus-ring)); outline-offset: 3px; transition: outline-color var(--duration-long4) var(--easing-standard); }
  .flight { position: fixed; z-index: 101; object-fit: cover; object-position: top; border-radius: var(--corner-medium); }
  /* rise — 보드가 아래에서 살짝 떠오르고 카드가 차례로 */
  .rise .cd { opacity: 0; transform: translateY(var(--motion-enter-shift)); }
  .rise.in .cd { opacity: 1; transform: none; transition: opacity var(--duration-medium2) var(--easing-decelerate), transform var(--duration-medium2) var(--easing-decelerate);
    transition-delay: calc(var(--motion-stagger) * var(--i)); }
  .tag { position: fixed; left: var(--space-16); bottom: var(--space-16); z-index: 200; padding: var(--space-4) var(--space-8); border-radius: var(--corner-small); background: var(--surface-container-high); color: var(--on-surface-variant); font: var(--type-label-medium); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<span class="tag" id="tag"></span>
<script src="draft.js"></script>
<script type="module">
  import { createScene, sceneEasing, handoffMs } from "../../../plugin/viewer/js/preparation-scene.js";
  const q = new URLSearchParams(location.search);
  const mode = ["hero", "fade", "cursor", "rise"].includes(q.get("mode")) ? q.get("mode") : "hero";
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
  const LABEL = { hero: "지금 — 그림이 카드 자리로 날아간다", fade: "겹쳐 사라지기", cursor: "겹쳐 사라지기 + 그 카드에 커서", rise: "보드가 떠오르고 카드가 차례로" };
  document.getElementById("tag").textContent = LABEL[mode];

  const CARDS = [["PearlListPreview", "PearlListPreview"], ["PearlListThemesPreview", "PearlListPreview"], ["PearlListThemesPreview", "PearlListThemesPreview_1"],
    ["PearlEmptyPreview", "PearlEmptyPreview"], ["PearlErrorPreview", "PearlErrorPreview"]];
  function board() {
    const groups = [[0], [1, 2], [3], [4]];
    const html = `<div class="bd${mode === "rise" ? " rise" : ""}" id="bd">${groups.map(g => `<section class="g"><div class="gh"><b>${CARDS[g[0]][0]}</b><span>${g.length}장 · 67%</span></div>
      <div style="display:flex;gap:var(--space-24)">${g.map(i => `<article class="cd" style="--i:${i}" data-i="${i}"><div class="st"><img src="../img/pearl/${CARDS[i][1]}.jpg" alt=""></div><div class="lb">360×780dp</div></article>`).join("")}</div></section>`).join("")}</div>`;
    document.getElementById("app").innerHTML = shellC("ok", html);
  }

  let scene, timers = [];
  const later = (ms, f) => timers.push(setTimeout(f, ms));
  async function run() {
    timers.forEach(clearTimeout); timers = []; scene?.destroy(); document.querySelector(".flight")?.remove();
    board();
    scene = createScene({ phase: "project", started: Date.now(), file: "PearlPreviews.kt", palette: "original" });
    later(1500, () => scene.setPhase("environment"));
    later(3000, () => scene.setPhase("render"));
    later(4500, async () => {
      const img = new Image(); img.src = "../img/pearl/PearlListPreview.jpg"; await img.decode();
      scene.image.src = img.src; scene.fit(360, 780); scene.reveal(false);
      later(handoffMs(false) + 1500, () => { scene.host.dataset.boardArrival = "presenting"; later(1200, hand); });
    });
  }
  function hand() {
    const target = document.querySelector('.cd[data-i="0"]'), stage = target.querySelector(".st");
    const host = scene.host, d = handoffMs(false);
    if (mode === "hero") {
      // 지금 뷰어(preparation.js finish)와 같은 흐름
      const from = scene.image.getBoundingClientRect(), to = stage.getBoundingClientRect();
      const flight = scene.image.cloneNode(); flight.className = "flight";
      Object.assign(flight.style, { left: `${from.x}px`, top: `${from.y}px`, width: `${from.width}px`, height: `${from.height}px` });
      document.body.append(flight); stage.style.visibility = "hidden";
      const color = getComputedStyle(host.querySelector(".art-pill")).borderTopColor;
      host.style.pointerEvents = "none";
      host.animate([{ opacity: 1 }, { opacity: 0 }], { duration: d * .8, fill: "forwards" });
      flight.animate([{ left: `${from.x}px`, top: `${from.y}px`, width: `${from.width}px`, height: `${from.height}px` },
        { left: `${to.x}px`, top: `${to.y}px`, width: `${to.width}px`, height: `${to.height}px` }], { duration: d, easing: sceneEasing("--easing-standard"), fill: "forwards" })
        .finished.then(() => { stage.style.visibility = ""; flight.remove(); target.style.setProperty("--arrival-color", color); target.classList.add("arrival");
          setTimeout(() => target.classList.remove("arrival"), 600); scene.destroy(); scene = null; });
    } else {
      // 나머지 셋 — 그림은 제자리에서 준비 화면과 함께 흐려진다. 보드는 처음부터 그 아래에 있다
      const fade = getComputedStyle(document.documentElement).getPropertyValue("--duration-medium2").trim();
      host.style.pointerEvents = "none";
      host.animate([{ opacity: 1 }, { opacity: 0 }], { duration: parseFloat(fade), easing: sceneEasing("--easing-standard"), fill: "forwards" })
        .finished.then(() => { scene.destroy(); scene = null; });
      if (mode === "cursor") target.classList.add("cursor");
      if (mode === "rise") requestAnimationFrame(() => document.getElementById("bd").classList.add("in"));
    }
    later(4000, run);
  }
  addEventListener("message", e => { if (e.data === "replay") run(); });
  run();
</script>
</body>
</html>
